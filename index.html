<!DOCTYPE html><html><head><meta charset="utf-8"><title>FALAJ: How it works</title><style>html,body{margin:0;height:100%;background:#0B2C25;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}#c{position:fixed;right:22px;bottom:22px;display:flex;gap:10px;align-items:center;transition:opacity .4s;font:500 14px sans-serif;color:#F6F1E4}#c span{background:rgba(13,49,41,.85);padding:10px 14px;border-radius:999px;border:1px solid rgba(248,212,125,.35)}#c button{width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(248,212,125,.6);background:rgba(13,49,41,.9);color:#F8D47D;cursor:pointer;font-size:18px}#p{position:fixed;right:22px;top:22px;display:none;padding:12px 20px;border-radius:999px;border:1.5px solid rgba(248,212,125,.6);background:rgba(13,49,41,.92);color:#F8D47D;font:600 18px monospace}</style></head><body><iframe id="f" src="FALAJ_How_It_Works_loop.html" allow="fullscreen"></iframe><div id="p">&#10074;&#10074; Paused &middot; Space to resume</div><div id="c"><span>Space pause &middot; &larr; &rarr; scenes &middot; F full screen</span><button id="pb" title="Pause (Space)">&#10074;&#10074;</button><button id="fb" title="Full screen (F)">&#9974;</button></div><script>
const f=document.getElementById('f'),P=document.getElementById('p'),PB=document.getElementById('pb'),C=document.getElementById('c');let w,orig,base=performance.now(),paused=false,pt=0,T=180,SC=[],h;
function now(){return paused?pt:((performance.now()-base)/1000)%T}
function setP(v){if(v===paused)return;if(v){pt=now();paused=true}else{paused=false;base=performance.now()-pt*1000}P.style.display=paused?'block':'none';PB.innerHTML=paused?'&#9654;':'&#10074;&#10074;'}
function jump(t){t=((t%T)+T)%T;if(paused)pt=t;else base=performance.now()-t*1000;if(orig)orig(t)}
function fs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}
function key(e){if(e.code==='Space'){e.preventDefault();setP(!paused)}else if(e.key==='f'||e.key==='F'){e.preventDefault();fs()}else if(e.key==='ArrowRight'){e.preventDefault();const t=now(),n=SC.find(x=>x[1]>t+.05);jump(n?n[1]:0)}else if(e.key==='ArrowLeft'){e.preventDefault();const t=now(),c=[...SC].reverse().find(x=>x[1]<=t-1.5);jump(c?c[1]:0)}}
function show(){C.style.opacity=1;document.body.style.cursor='default';clearTimeout(h);h=setTimeout(()=>{C.style.opacity=0},2500)}
f.addEventListener('load',()=>{w=f.contentWindow;orig=w.seek;try{SC=w.eval('SC');T=w.eval('T')}catch(e){}base=performance.now();w.seek=function(){orig(now())};w.addEventListener('keydown',key);w.document.addEventListener('click',()=>setP(!paused));w.addEventListener('mousemove',show);f.focus()});
addEventListener('keydown',key);addEventListener('mousemove',show);show();
PB.onclick=()=>{setP(!paused);f.focus()};document.getElementById('fb').onclick=()=>{fs();f.focus()};
</script></body></html>
