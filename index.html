let w,d,orig,base=performance.now(),paused=false,pt=0,T=180,SC=[],h,ar=false;
try{ar=new URLSearchParams(location.search).get('lang')==='ar'||localStorage.getItem('falajLang')==='ar'}catch(e){}
const UI={en:{hint:'Space pause \u00b7 \u2190 \u2192 scenes \u00b7 F full screen \u00b7 A \u0639\u0631\u0628\u064a',pause:'&#10074;&#10074; Paused \u00b7 Space to resume',lb:'\u0639'},ar:{hint:'\u0627\u0644\u0645\u0633\u0627\u0641\u0629 \u0625\u064a\u0642\u0627\u0641 \u00b7 \u2190 \u2192 \u0627\u0644\u0645\u0634\u0627\u0647\u062f \u00b7 F \u0645\u0644\u0621 \u0627\u0644\u0634\u0627\u0634\u0629 \u00b7 A English',pause:'&#10074;&#10074; \u0645\u062a\u0648\u0642\u0641 \u00b7 \u0627\u0636\u063a\u0637 \u0627\u0644\u0645\u0633\u0627\u0641\u0629 \u0644\u0644\u0645\u062a\u0627\u0628\u0639\u0629',lb:'EN'}};
function ui(){const u=UI[ar?'ar':'en'];HI.innerHTML=u.hint;P.innerHTML=u.pause;LB.textContent=u.lb;HI.dir=ar?'rtl':'ltr';P.dir=ar?'rtl':'ltr';P.style.fontFamily=ar?'Tahoma,"Segoe UI",sans-serif':''}
const norm=s=>s.replace(/\s+/g,' ').trim();
const INL=new Set(['B','SPAN','BR','SUB','SUP','I','SMALL']);
function applyLang(){if(!d)return;const st=d.getElementById('stage');d.documentElement.classList.toggle('ar',ar);
 if(!d.getElementById('arcss')){const s=d.createElement('style');s.id='arcss';s.textContent=AR_CSS;d.head.appendChild(s)}
 if(ar){
  st.querySelectorAll('*').forEach(e=>{if(e.closest('svg')||e.closest('[data-tr]')||!e.textContent.trim())return;if([...e.children].some(c=>!INL.has(c.tagName)))return;
   const k=norm(e.textContent);let tr=AR_E[k];if(tr===undefined){const m=AR_P.find(([p])=>k.startsWith(p));if(m)tr=m[1]}
   if(tr===undefined)return;e._en=e.innerHTML;e.innerHTML=tr;e.setAttribute('data-tr','');if(!e.closest('.eq'))e.dir='rtl'});
  st.querySelectorAll('svg text').forEach(t=>{if(t.hasAttribute('data-tr'))return;const k=t.textContent.trim();let tr=AR_S[k];
   if(k.startsWith('\u25a0')){t._en=t.innerHTML;t.innerHTML=AR_LEG;t.setAttribute('data-tr','');return}
   if(tr){t._en=t.innerHTML;t.textContent=tr;t.setAttribute('data-tr','')}});
 }else{st.querySelectorAll('[data-tr]').forEach(e=>{e.innerHTML=e._en;e.removeAttribute('data-tr');e.removeAttribute('dir')})}
 if(orig)orig(now());ui();try{localStorage.setItem('falajLang',ar?'ar':'en')}catch(e){}}
function fixFrame(){if(!ar||!d)return;const o=d.getElementById('orig');if(o){const m=o.textContent.match(/origin (\d+) of 19/);if(m)o.textContent='\u0627\u0644\u0645\u0646\u0637\u0644\u0642 '+m[1]+' \u0645\u0646 19'}}

let simF=null,simTab=-1,simCool=0;
function setupSim(){const sh=d.getElementById('shots');if(!sh||simF)return;sh.querySelectorAll('.shot').forEach(i=>i.style.display='none');
 const sf=d.createElement('iframe');sf.src='/Falaj/simulator/AERIVA_Simulator.html'+(ar?'?lang=ar':'');
 sf.style.cssText='position:absolute;left:0;top:0;width:1600px;height:900px;border:0;transform:scale(.675);transform-origin:0 0;pointer-events:none;background:#F2F4EF';sh.appendChild(sf);simF=sf;sf.addEventListener('load',()=>{simTab=-1})}
function simSync(t){if(!simF)return;let sd;try{sd=simF.contentDocument}catch(e){return}if(!sd||!sd.getElementById('tabs'))return;
 const lt=t-141;if(lt<-2||lt>26)return;const seg=lt<6.5?0:lt<13.5?1:lt<17.5?2:lt<21.5?3:4;const want=seg===4?0:seg;const wantAr=ar||seg===4;
 const bs=sd.querySelectorAll('#tabs button');if(bs.length&&simTab!==want){bs[want].click();simTab=want}
 const isAr=sd.documentElement.lang==='ar';const nowMs=performance.now();
 if(isAr!==wantAr&&nowMs>simCool){const lb=sd.getElementById('langbtn');if(lb){lb.click();simCool=nowMs+2500;simTab=-1}}}
function now(){return paused?pt:((performance.now()-base)/1000)%T}
function setP(v){if(v===paused)return;if(v){pt=now();paused=true}else{paused=false;base=performance.now()-pt*1000}P.style.display=paused?'block':'none';PB.innerHTML=paused?'&#9654;':'&#10074;&#10074;'}
function jump(t){t=((t%T)+T)%T;if(paused)pt=t;else base=performance.now()-t*1000;if(orig){orig(t);fixFrame();simSync(t)}}
function fs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}
function key(e){if(e.code==='Space'){e.preventDefault();setP(!paused)}else if(e.key==='f'||e.key==='F'){e.preventDefault();fs()}else if(e.key==='a'||e.key==='A'){e.preventDefault();ar=!ar;applyLang()}else if(e.key==='ArrowRight'){e.preventDefault();const t=now(),n=SC.find(x=>x[1]>t+.05);jump(n?n[1]:0)}else if(e.key==='ArrowLeft'){e.preventDefault();const t=now(),c=[...SC].reverse().find(x=>x[1]<=t-1.5);jump(c?c[1]:0)}}
function show(){C.style.opacity=1;clearTimeout(h);h=setTimeout(()=>{C.style.opacity=0},2500)}
f.addEventListener('load',()=>{w=f.contentWindow;d=f.contentDocument;orig=w.seek;try{SC=w.eval('SC');T=w.eval('T')}catch(e){}base=performance.now();w.seek=function(){const t=now();orig(t);fixFrame();simSync(t)};setupSim();w.addEventListener('keydown',key);d.addEventListener('click',()=>setP(!paused));w.addEventListener('mousemove',show);if(ar)applyLang();f.focus()});
addEventListener('keydown',key);addEventListener('mousemove',show);show();ui();
PB.onclick=()=>{setP(!paused);f.focus()};LB.onclick=()=>{ar=!ar;applyLang();f.focus()};document.getElementById('fb').onclick=()=>{fs();f.focus()};
